services:
  api:
    build: ./api
    container_name: shorty-ai-api
    ports:
      - "8000:8000"
    volumes:
      - ./generations:/app/generations
      - ./api:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: shorty-ai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_MAX_RECONNECT_ATTEMPTS=10
      - NODE_OPTIONS=--max-old-space-size=2048
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

networks:
  default:
    name: shorty-ai
